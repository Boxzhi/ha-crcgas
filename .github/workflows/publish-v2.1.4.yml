name: Publish v2.1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.1.4.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Boxzhi/ha-crcgas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b492accd87048ff01c5f1905553b87e2c6845721
          persist-credentials: false
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b492accd87048ff01c5f1905553b87e2c6845721"
          test "$(python -c 'import json; print(json.load(open("custom_components/crcgas/manifest.json"))["version"])')" = "2.1.4"
          if gh release view v2.1.4 >/dev/null 2>&1; then
            echo "v2.1.4 already exists; not modifying it"
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v2.1.4" >/dev/null 2>&1; then
            echo "Existing tag requires verification; refusing to replace it"
            exit 1
          fi
          cat > release-notes.md <<'RELEASE_NOTES'
          - 缴费历史使用小程序参数，兼容不分页和真实分页的响应，防止重复页和不完整快照。
          - 解析官方支付渠道及收费类型；最近缴费与年度次数仅统计成功燃气缴费，业务费单独统计。
          - 缴费快照独立持久化，首次无数据为未知，失败保留有效缓存；最近三个自然年。
          - 新增缴费渠道、年度缴费金额、历史状态和更新时间实体，并提供只读 WebSocket 查询。
          - 不将完整缴费明细写入 Recorder，不修改账单/阶梯采集周期。

          ## 校验
          - Regression tests、Hassfest：通过。
          - HACS：仓库尚未启用 Issues、未设置有效 Topics（元数据检查未通过）。
          - 尚未完成真实 Home Assistant 环境联网回归测试。
          RELEASE_NOTES
          gh release create v2.1.4 --target "b492accd87048ff01c5f1905553b87e2c6845721" --title "v2.1.4" --notes-file release-notes.md --latest
